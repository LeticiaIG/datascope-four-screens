<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataScope Four Screens</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the Scenario Editor's screen, repeated. One large picture of the site, a floating list of alternatives at top right, a live analysis bar underneath. Light only. */
:root{
  color-scheme:light;
  --bg:#dfe8e3; --surface:#fbfdfc; --sunk:#eef3f0; --ink:#1c2a28; --muted:#5d6d69; --line:#d2dcd7;
  --accent:#3b7a66; --accent-soft:#dcebe4; --warn:#b07a12; --over:#b5534a;
  --font:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --r:18px; --gap:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:clamp(14px,1.9vh,22px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.3}
.app{height:100%;display:flex;flex-direction:column}
h2{margin:0;font-size:1.05rem;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 10px rgba(20,40,34,.05)}

.top{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;padding:.4rem .55rem;display:flex;align-items:center;gap:.9rem;max-width:calc(100% - 20px);box-shadow:0 4px 18px rgba(20,40,34,.18)}
.main > .stage{border:0;border-radius:0;box-shadow:none}
.brand{color:inherit;text-decoration:none;font-weight:700;font-size:1.45rem;letter-spacing:-.03em;padding-left:.3rem;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto}
.tab{font-weight:600;font-size:.9rem;color:var(--muted);border-radius:9px;padding:.4rem .8rem;text-decoration:none;white-space:nowrap}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;padding:0;background:var(--sunk)}
.stage canvas,.stage > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.openlive{position:absolute;right:.9rem;bottom:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;font-weight:700;color:var(--ink);text-decoration:none}
.stage .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;padding:2rem;text-align:center}
.say{position:absolute;left:.9rem;bottom:.9rem;max-width:calc(100% - 26rem);background:var(--surface);border-radius:14px;padding:.5rem 1rem;font-size:1rem;font-weight:600}
.alts{position:absolute;top:4.6rem;right:.9rem;width:23rem;max-width:calc(100% - 1.8rem);padding:.9rem;display:flex;flex-direction:column;gap:.5rem}
.alts p{margin:0;font-size:1.25rem;font-weight:500;letter-spacing:-.01em}
.opt{position:relative;display:flex}
.opt input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.opt > span{flex:1 1 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.1rem .6rem;border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;background:var(--surface)}
.opt .code{grid-row:1 / span 2;font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:.2rem .4rem}
.opt .nm{font-size:.98rem;font-weight:700;line-height:1.15}
.opt .sub{grid-column:2;font-size:.82rem;color:var(--muted);line-height:1.2}
.opt .dot{width:1.05rem;height:1.05rem;border-radius:50%;border:2px solid var(--line)}
.opt input[type=checkbox] + span .dot{border-radius:.3rem}
.opt input:checked + span{background:var(--accent-soft);border-color:var(--accent)}
.opt input:checked + span .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.opt input[type=checkbox]:checked + span .dot{background:var(--accent)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.live{padding:.7rem 1rem .9rem;display:flex;flex-direction:column;gap:.5rem}
.hd{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem}
.hd::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--accent)}
.pill{margin-left:auto;font-size:.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:.15rem .6rem}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{padding:0 1rem;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:.1rem;min-width:0}
.tile:first-child{border-left:0;padding-left:0}
.tile .k{font-size:.85rem;font-weight:600}
.tile .v{font-size:1.9rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.tile .v small{font-size:.85rem;font-weight:600;letter-spacing:0;color:var(--muted)}
.tile .d{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d em{font-style:normal;font-weight:700;color:var(--accent)}
.tile .d em.bad{color:var(--over)}
.meter{height:3px;border-radius:2px;background:var(--line);margin-top:.3rem;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}

/* the room: the table decides, the center wall shows, the right wall measures */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.steps button{font:inherit;font-size:.78rem;font-weight:700;border:0;border-radius:9px;background:none;color:var(--muted);padding:.4rem .2rem;cursor:pointer;line-height:1.1}
.steps button b{display:block;font-size:1rem}
.steps button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chap{position:absolute;top:.9rem;right:.9rem;background:var(--surface);border-radius:999px;padding:.35rem 1rem;font-weight:700}
.measure{flex:1 1 auto;min-height:0;border:0;border-radius:0;padding:4.8rem 1.6rem 1.4rem;display:flex;flex-direction:column;gap:1.2rem;position:relative}
.measure .hd{font-size:1.4rem}
.chosen{display:flex;flex-wrap:wrap;gap:.5rem}
.chosen span{font-size:.95rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;color:var(--muted)}
.chosen span.now{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chosen b{color:var(--accent);margin-right:.35rem}
.dark{--bg:#050606;--surface:#0f1312;--sunk:#1a201e;--ink:#eef3f1;--muted:#9aaaa5;--line:#2a3230;--accent:#6fd0ac;--accent-soft:#16332b;--warn:#e3a85c;--over:#e98176;color:var(--ink);color-scheme:dark}
body.dark{background:var(--bg)}
.dark .card{box-shadow:none}
.mbody{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:1.5rem}
.smalls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.8rem;min-height:0}
.sm{border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.2rem;min-height:0;min-width:0}
.sm.on{border-color:var(--accent);background:var(--accent-soft)}
.sm .t{display:flex;align-items:baseline;gap:.5rem;font-size:.95rem;font-weight:700;line-height:1.15}
.sm .t b{color:var(--accent)}
.sm .t span{flex:1 1 auto;min-width:0}
.sm .t em{font-style:normal;font-size:.85rem;color:var(--muted);white-space:nowrap}
.sm .r{flex:1 1 auto;min-height:0}
.sm svg{width:100%;height:100%;display:block}
.radar{min-height:0;min-width:0}
.radar svg{width:100%;height:100%;display:block}
.radar text{font-family:var(--font);font-size:16px;font-weight:600;fill:var(--ink)}
.radar .up{fill:var(--accent)} .radar .down{fill:var(--over)}
.radar .key{font-size:13px;fill:var(--muted)}
.measure .tiles{display:flex;flex-direction:column;gap:1rem}
.measure .tile{border-left:0;padding:0}
.measure .tile .k{font-size:1rem}
.measure .tile .v{font-size:2.3rem}
.measure .tile .v small{font-size:1rem}
.measure .tile .d{font-size:.85rem}
.measure .meter{height:4px;margin-top:.4rem}
.measure > .note{align-self:flex-start;width:26rem;max-width:100%}

.opt .end{grid-column:3;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
.opt .val{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.offerbar{padding:.7rem 1.1rem;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.6rem 1.8rem}
.offerbar .offer small{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.offerbar .offer b{font-size:1.45rem;font-weight:500;letter-spacing:-.02em}
.offerbar .mid{display:flex;flex-direction:column;gap:.2rem}
.offerbar .goes{font-size:1rem;font-weight:600}
.offerbar span.goes{font-size:.9rem;color:var(--muted)}
.bar{display:flex;height:.9rem;border-radius:999px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%;transition:width .25s}
.legend{display:flex;flex-wrap:wrap;gap:.1rem 1.3rem;font-size:.85rem;font-weight:600}
.legend span{display:flex;align-items:center;gap:.4rem}
.legend span::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.fit{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem}
.fit b{font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums}
.fit .pill{margin:0}
.fit.over .pill{background:var(--over);color:#fff}
.fit.over b{color:var(--over)}
.goal{font-size:1.05rem;font-weight:600;color:var(--muted);text-align:center}
.measure .offerbar{border:1px solid var(--line);border-radius:14px}

.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov .lb{fill:#fbfdfc;fill-opacity:.94}
.ov .lt{font-family:var(--font);font-size:13px;font-weight:700;fill:#1c2a28}
.ov .lb.c{fill:#fbeeea} .ov .lt.c{fill:#9a3f36}
.live .hd{flex-wrap:wrap}
.ov .lb.s{fill:#f3e8f0} .ov .lt.s{fill:#7d3a6c}
.ov .lb.dk{fill:#1c2a28} .ov .lt.dk{fill:#fff}
#fp{fill:#fbfdfc;fill-opacity:.25;stroke:#1c2a28;stroke-width:2.5}
#fp.drag{pointer-events:auto;cursor:grab;touch-action:none}
#fp.drag:focus-visible{outline:none;stroke:var(--accent);stroke-width:5}
.rot{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2rem .6rem;font-size:.9rem;font-weight:600;border-top:1px solid var(--line);padding-top:.5rem}
.rot input{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0}

/* right wall: the chosen scenario and its alternatives on the left, the measures on the right, on a greyer ground */
.grey{--bg:#c9cecd;--surface:#dde1e0;--sunk:#cfd4d3;--line:#b7bfbd;--muted:#4f5c58;--accent-soft:#cfe0d8}
body.grey{background:var(--bg)}
.scr:has(.mini.grey){background:#c9cecd}
.outcome{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.45fr) minmax(0,1fr);gap:var(--gap);padding:12px}
.outcome .say{max-width:calc(100% - 19.5rem)}
.pick{position:absolute;bottom:.9rem;right:.9rem;width:17rem;max-width:calc(100% - 1.8rem);padding:.35rem}
.imp{min-height:0;min-width:0;padding:4.3rem 1.1rem .9rem;display:flex;flex-direction:column;gap:.5rem}
.imp .hd{font-size:1.15rem}
.imp .radar{flex:1 1 auto;min-height:0}
.radar.mid text{font-size:15px}
.radar.mid .key{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 1rem;border-top:1px solid var(--line);padding-top:.6rem}
.kpis .tile{border-left:0;padding:0}
.kpis .tile .k{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .tile .v{font-size:1.65rem}
.kpis .tile .v small{font-size:.75rem}
.kpis .tile .d{font-size:.72rem}
.scen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-height:0;min-width:0}
.sc{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.sc input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sc .thumb{position:relative;flex:1 1 44%;min-height:0;background:var(--sunk)}
.sc .thumb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sc .t{padding:.4rem .6rem 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 .4rem;align-items:baseline;line-height:1.15}
.sc .t b{color:var(--accent);font-size:.95rem}
.sc .t em{font-style:normal;font-size:.8rem;font-weight:700;text-align:right;white-space:nowrap}
.sc .t span{grid-column:1 / -1;font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .r{flex:1 1 40%;min-height:0;padding:0 .3rem .3rem}
.sc .r svg{width:100%;height:100%;display:block}
.sc.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.sc:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ben{min-height:0;min-width:0;padding:.9rem 1.1rem .4rem;display:flex;flex-direction:column}
.ben .hd{font-size:1.15rem}
.ben .pill.over{background:var(--over);color:#fff}
.brow{position:relative;flex:1 1 0;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:0 .8rem;padding:.2rem .1rem;border-top:1px solid var(--line)}
.ben .hd + .brow{border-top:0}
.brow input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.brow .bc{font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:.2rem .45rem}
.brow .bt{display:flex;flex-direction:column;min-width:0}
.brow small{font-size:.8rem;font-weight:600;color:var(--muted)}
.brow b{font-size:1.3rem;font-weight:700;line-height:1.2}
.brow .dot{width:1.1rem;height:1.1rem;border-radius:.3rem;border:2px solid var(--line)}
.brow.off b{color:var(--muted);font-weight:600}
.brow.off .bc{color:var(--muted);background:var(--sunk)}
.brow.on .dot{border-color:var(--accent);background:var(--accent)}
.brow input:focus-visible ~ .bt{outline:2px solid var(--accent);outline-offset:2px}
/* table: the map fills the screen, the panel floats on it */
.budget{position:absolute;left:.9rem;bottom:.9rem;background:var(--surface);border-radius:999px;padding:.45rem .9rem;box-shadow:0 2px 10px rgba(20,40,34,.14)}
.budget .omini{margin:0}
a.lab{text-decoration:none}
.sites{display:flex;gap:2px;background:var(--sunk);border-radius:999px;padding:2px;flex:0 0 auto}
.sites button{font:inherit;font-size:.82rem;font-weight:700;color:var(--muted);background:none;border:0;border-radius:999px;padding:.3rem .7rem;cursor:pointer}
.sites button[aria-pressed="true"]{background:var(--ink);color:#fff}
.vadd,.vpanel{position:absolute;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 22px rgba(20,40,34,.16)}
.vadd{left:.9rem;top:4.6rem;width:21rem;padding:.9rem;display:flex;flex-direction:column;gap:.6rem;margin:0}
.vadd h3{margin:0;font-size:1.15rem}
.stances{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.stances label{position:relative;display:flex}
.stances input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.stances span{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;border:1px solid var(--line);border-radius:10px;padding:.45rem .2rem;font-size:.78rem;font-weight:700;text-align:center;line-height:1.1;background:#fff}
.stances span::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.stances input:checked + span{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c)}
.stances input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.vadd textarea{font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:.55rem .6rem;resize:none;height:4.8rem;background:#fff;color:var(--ink)}
.vrow{display:flex;align-items:stretch;gap:.5rem}
.vprev{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.vprev img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.vgen{flex:1 1 auto;font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--ink);border-radius:10px;padding:.55rem .6rem;background:#fff;color:var(--ink);cursor:pointer}
.vgen:disabled{opacity:.4;cursor:default}
.vgo{font:inherit;font-weight:700;font-size:.95rem;border:0;border-radius:10px;padding:.6rem 1.2rem;background:var(--ink);color:#fff;cursor:pointer}
.vgo:disabled{opacity:.35;cursor:default}
.vhint{margin:0;font-size:.76rem;font-weight:600;color:var(--muted)}
.vpanel{right:.9rem;top:4.6rem;bottom:.9rem;width:23rem;display:flex;flex-direction:column;overflow:hidden}
.vpanel .hd{padding:.8rem .9rem .5rem;font-size:1.1rem}
.vbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.vcount{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;padding:0 .9rem .7rem}
.vcount div{border-top:3px solid var(--c);padding-top:.3rem}
.vcount b{display:block;font-size:1.6rem;line-height:1}
.vcount span{font-size:.72rem;font-weight:700;color:var(--muted)}
.vlist{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.5rem;padding:0 .9rem .7rem}
.vcard{flex:0 0 auto;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:#fff;overflow:hidden;font-family:var(--font);color:var(--ink)}
.vcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.vcard p{margin:0;padding:.5rem .65rem .2rem;font-size:.92rem;font-weight:600;line-height:1.3}
.vcard small{display:block;padding:0 .65rem .5rem;font-size:.72rem;font-weight:600;color:var(--muted)}
.vfoot{display:flex;gap:.5rem;padding:.5rem .9rem;border-top:1px solid var(--line)}
.vfoot button{font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;background:none;padding:.25rem .7rem;cursor:pointer;color:var(--muted)}
.vpop .leaflet-popup-content{margin:8px}
.vpop .vcard{border-top:0;border-right:0;border-bottom:0;border-radius:0}
.vdraftw{background:none;border:0}
.leaflet-tooltip.glab.pick{pointer-events:auto;cursor:pointer}
.vdraft{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:2px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1c2a28;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:grab}
.vdraft i{transform:rotate(45deg);font-style:normal;font-size:11px;font-weight:800;color:#fff;font-family:var(--font)}
.stage.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#dfe8e3;opacity:0;transition:opacity .4s}
.stage.embed iframe.on{opacity:1}
body.embed .top{display:none}
.back{display:none;position:fixed;left:12px;bottom:12px;z-index:30;width:2.6rem;height:2.6rem;border-radius:50%;background:#1c2a28;color:#fff;align-items:center;justify-content:center;font-size:1.25rem;text-decoration:none;box-shadow:0 4px 14px rgba(20,40,34,.3)}
body.embed .back{display:flex}
.rw{position:absolute;right:.5rem;top:.5rem;z-index:2;display:flex;gap:2px;background:#1c2a28;border-radius:999px;padding:2px}
.rw button{font:inherit;font-size:.72rem;font-weight:700;color:#cfd8d4;background:none;border:0;border-radius:999px;padding:.2rem .6rem;cursor:pointer}
.rw button[aria-pressed="true"]{background:#fbfdfc;color:#1c2a28}
.chosen button{font:inherit;font-size:.95rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;color:var(--muted);background:none;cursor:pointer}
.chosen button.now{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
label.sm{position:relative;cursor:pointer}
label.sm input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}

.krow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 1.4rem;border:1px solid var(--line);border-radius:14px;padding:.7rem 1.1rem}

/* the table map: a real map of the place, the intervention drawn on it */

.leaflet-tooltip.glab.e{background:#fbfdfc;border-color:#d9b3ac;color:#9a3f36}

.grot{display:flex;align-items:center;justify-content:center;background:#1c2a28;color:#fff;border-radius:50%;font-size:18px;font-weight:700;cursor:ew-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.stage[data-view="map"]{cursor:grab;touch-action:none}
.zoomc{position:absolute;right:.9rem;bottom:.9rem;display:flex;gap:4px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:0 2px 10px rgba(20,40,34,.14)}
.zoomc button{font:inherit;font-size:1.15rem;font-weight:700;line-height:1;width:2.3rem;height:2.3rem;border:0;border-radius:9px;background:var(--sunk);color:var(--ink);cursor:pointer}
.omini{margin-left:auto;display:flex;align-items:center;gap:.8rem;font-size:.85rem;font-weight:600;color:var(--muted)}
.omini .bar{width:12rem;height:.55rem}
.omini .pill{margin:0}
.omini .pill.over{background:var(--over);color:#fff}
.todo{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.9rem;font-weight:600;color:var(--muted)}
.todo span{border:1px dashed var(--muted);border-radius:999px;padding:.2rem .7rem}
#rh circle{fill:#1c2a28} #rh text{font-family:var(--font);font-size:19px;font-weight:700;fill:#fff}
#rh #rhv{fill:#1c2a28;font-size:13px;text-anchor:start}
#rh.drag{pointer-events:auto;cursor:ew-resize;touch-action:none}
#rh:focus-visible{outline:none} #rh:focus-visible circle{stroke:var(--accent);stroke-width:4}
.ov .lb.e{fill:#fbf1dc} .ov .lt.e{fill:#8a5c08}
.pin{pointer-events:auto;cursor:pointer}
.pin:focus-visible{outline:none} .pin:focus-visible circle:last-child{stroke:#1c2a28}
.key{position:absolute;left:.9rem;bottom:.9rem;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.35rem;font-size:.82rem;font-weight:600}
.key .r{display:flex;flex-wrap:wrap;gap:.2rem .9rem}
.key .r span{display:flex;align-items:center;gap:.35rem}
.key i{width:.8rem;height:.8rem;border-radius:50%;background:var(--c);display:inline-block}
.key i.ring{background:var(--surface);border:3px solid var(--muted)}
.key small{font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.35rem}
.voices{bottom:.9rem;overflow:hidden}
.tchips{display:flex;flex-wrap:wrap;gap:.3rem}
.tchips button{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);padding:.25rem .7rem;cursor:pointer}
.tchips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

.mix i{display:block;height:100%}
.vlist{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.35rem}
.vi{font:inherit;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:.1rem .5rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:.45rem .6rem;cursor:pointer;font-size:.88rem;line-height:1.25}

/* notes from the brief: what each screen is there to show */
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:.5rem .8rem;font-size:.8rem;line-height:1.3}

/* "All": the four screens as they stand in the room, which is dark */
body.room{background:#0a0c0b}

.room{flex:1 1 auto;min-height:0;padding:3.6rem 22px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;perspective:2400px}
.walls{display:flex;align-items:center;justify-content:center;width:100%;perspective:2000px}
.scr{position:relative;display:block;flex:0 0 auto;width:32.5%;aspect-ratio:16/9;background:var(--bg);border:6px solid #1c2a28;border-radius:10px;overflow:hidden;box-shadow:0 14px 34px rgba(20,40,34,.28);text-decoration:none;color:inherit}

.scr .lab{position:absolute;left:.5rem;top:.5rem;background:#1c2a28;color:#fff;font-size:.78rem;font-weight:700;border-radius:999px;padding:.2rem .7rem;z-index:2}
.wl{transform:rotateY(34deg);transform-origin:right center}
.wr{transform:rotateY(-34deg);transform-origin:left center}
.tb{width:44%;transform:rotateX(46deg);transform-origin:top center}
.mini{width:1600px;height:900px;transform-origin:0 0;transform:scale(var(--k,.3));display:flex;background:var(--bg)}
.scr:has(.mini.dark){background:#050606}
.mini > .main{flex:1 1 auto}
.swap{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}

.swap button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}

/* words first: gained, given up, not known yet; a wheel of petals; the trace back to the choice */
.outcome{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1.25fr) minmax(0,1fr)}
.led{min-height:0;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.card.led{padding:4.3rem 1rem .8rem}
.led .col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:.45rem;--c:var(--accent)}
.led .col.l{--c:var(--over)} .led .col.u{--c:var(--muted)}
.led h3{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:.45rem}
.led h3::before{content:"";width:.75rem;height:.75rem;border-radius:50%;background:var(--c)}
.led .col.u h3::before{background:none;border:2px dashed var(--c)}
.led .rows{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.35rem}
.nil{margin:0;font-size:.9rem;font-weight:600;color:var(--muted)}
.stm{font:inherit;color:var(--ink);text-align:left;flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.05rem .55rem;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:#f3f6f4;padding:.45rem .55rem;cursor:pointer;--c:var(--accent)}
.stm.l{--c:var(--over)} .stm.u{--c:#8b9894}
.stm b{font-size:.98rem;font-weight:700;line-height:1.2}
.stm small{grid-column:2 / -1;font-size:.76rem;font-weight:600;color:var(--muted)}
.stm.sel{background:#fff;border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.cd{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:.12rem .35rem;white-space:nowrap}
.dg{display:flex;align-items:flex-end;gap:2px;height:1.15rem;width:1.25rem;flex:0 0 auto}
.dg i{flex:1 1 0;border-radius:2px;background:var(--line)}
.dg i:nth-child(1){height:40%} .dg i:nth-child(2){height:70%} .dg i:nth-child(3){height:100%}
.dg i.on{background:var(--c)}
.dg.q i{background:none;border:1.5px dashed var(--c)}
.stm.u .dg.q{align-items:center;justify-content:center;font-weight:800;color:var(--muted);border:1.5px dashed var(--muted);border-radius:50%;width:1.2rem;height:1.2rem;font-size:.8rem}
.askd{margin:0;font-size:.82rem;font-weight:600;font-style:italic;color:var(--muted);border-left:3px dashed var(--line);padding-left:.5rem}
.lfoot{display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;color:var(--muted)}
.lfoot span{flex:1 1 auto;min-width:0}
.lfoot button{font:inherit;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);padding:.15rem .55rem;cursor:pointer}
.whl{min-height:0;min-width:0;display:flex;flex-direction:column}
.whl svg{flex:1 1 auto;min-height:0;width:100%;display:block}
.ring{fill:none;stroke:var(--ink);stroke-width:1.6}
.spk{stroke:var(--line);stroke-width:1}
.pt{stroke-width:1.5;stroke-linejoin:round}
.pt.g{fill:var(--accent);stroke:var(--accent)} .pt.l{fill:var(--over);stroke:var(--over)}
.pt.q{fill-opacity:.14;stroke-dasharray:4 3}
.pt[data-stm]{cursor:pointer}
.pt.sel{stroke:var(--ink);stroke-width:3;stroke-dasharray:none}
.pt.dim{opacity:.35}
.pt:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.pc{font-family:var(--font);font-size:11px;font-weight:700;fill:var(--muted)} .pc.dim{opacity:.4}
.wl{font-family:var(--font);font-size:15px;font-weight:700;fill:var(--ink)} .wl.off{fill:var(--muted);font-weight:600}
.rc{font-family:var(--font);font-size:10px;font-weight:600;fill:var(--muted)}
.whl[data-size="big"] .wl{font-size:18px} .whl[data-size="big"] .pc{font-size:13px} .whl[data-size="big"] .rc{font-size:13px}
.wkey{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem .9rem;font-size:.74rem;font-weight:600;color:var(--muted)}
.wkey span{display:flex;align-items:center;gap:.3rem}
.wkey i{width:.9rem;height:.6rem;border-radius:2px;background:var(--accent)} .wkey i.l{background:var(--over)} .wkey i.q{background:none;border:1.5px dashed var(--muted)}
.trc{min-height:0;min-width:0;padding:.7rem .9rem;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr);gap:.8rem}
.trace{min-height:0;min-width:0;display:flex;flex-direction:column;gap:.4rem}
.tq{display:flex;flex-wrap:wrap;gap:4px}
.tq button{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);padding:.25rem .7rem;cursor:pointer}
.tq button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.4rem}
.chain{display:grid;grid-template-columns:minmax(0,1fr);gap:.95rem}
.bx{position:relative;font:inherit;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:.1rem;border:1px solid var(--line);border-radius:12px;background:#f3f6f4;padding:.4rem .7rem}
.bx small{font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bx b{font-size:1rem;line-height:1.2} .bx > span{font-size:.9rem;font-weight:500;line-height:1.25}
.bx.g{border-left:5px solid var(--accent)} .bx.l{border-left:5px solid var(--over)} .bx.u{border-left:5px dashed var(--muted)}
.bx.ch{cursor:pointer} .bx.ch b{display:flex;align-items:center;gap:.4rem}
.bx + .bx::before{content:"↑";position:absolute;left:1.2rem;top:-1rem;font-size:.95rem;font-weight:700;color:var(--muted);line-height:1}
.measure .chain{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3rem}
.measure .bx + .bx::before{content:"←";left:-1.1rem;top:calc(50% - .5rem)}
.tnum,.tmsg{margin:0;font-size:.86rem;font-weight:500;line-height:1.3} .tnum b,.tmsg b{font-weight:700}
.sets{display:flex;flex-direction:column;gap:.3rem}
.setb{font:inherit;color:var(--ink);text-align:left;flex:0 0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:0 .5rem;border:1px solid var(--line);border-radius:10px;background:#f3f6f4;padding:.35rem .55rem;cursor:pointer}
.setb b{font-size:.92rem} .setb small{grid-column:2;font-size:.78rem;font-weight:600;color:var(--muted)}
.setb.g small{color:var(--accent)} .setb.l small{color:var(--over)}
.keep{font:inherit;font-size:.82rem;font-weight:700;border:1px solid var(--ink);border-radius:999px;background:none;color:var(--ink);padding:.25rem .8rem;cursor:pointer}
.ans{margin:0;font-size:.82rem;font-weight:700;color:var(--over)} .ans:empty{display:none}
.askf{display:flex;gap:.35rem;margin:0}
.askf input{flex:1 1 auto;min-width:0;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:.4rem .8rem;background:#fff;color:var(--ink)}
.askf button[type=submit]{font:inherit;font-size:.88rem;font-weight:700;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:.4rem .95rem;cursor:pointer}
.mic{font:inherit;flex:0 0 auto;width:2.1rem;height:2.1rem;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mic svg{width:1.05rem;height:1.05rem;display:block}
.mic.on{background:var(--over);border-color:var(--over);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(181,83,74,.25)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.mbody{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.mleft{min-height:0;min-width:0;display:flex;flex-direction:column;gap:.6rem}
.mleft .whl{flex:1 1 auto}
.mleft .smalls{flex:0 0 8.4rem;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.mright{min-height:0;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:.8rem}
.mright .trace{padding:.7rem .9rem;border:1px solid var(--line);border-radius:14px;max-height:17rem}
.sm .t{flex-wrap:wrap}
/* center wall in axonometric, in the manner of the original's Site layout: the residents, the key, the immersive view */
body.imm .top{display:none}
body.imm .akey{top:.9rem}
body.nopanels .akey,body.nopanels .stage[data-view="axo"] .zoomc{display:none}
.zoomc button[data-az="imm"][aria-pressed="true"]{background:var(--ink);color:#fff}
.imh{display:none} body.imm .imh{display:block}
.geomap.axo{position:absolute;inset:0}
.axo canvas.aagents{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mini .axo{pointer-events:none}
.amk{font-family:var(--font);font-size:12px;font-weight:700;color:#1c2a28;background:#fbfdfcf0;border:1px solid #b9cec4;border-radius:5px;padding:2px 7px;white-space:nowrap;pointer-events:none}
.amk.pl{display:flex;align-items:center;gap:5px;font-weight:600}
.amk.pl i{width:8px;height:8px;border-radius:50%;background:#3b7a66;border:1.5px solid #fff}
.amk.dk{background:#1c2a28;border-color:#1c2a28;color:#fff}
.amk.sn{background:#fbfdfc;color:#7d3a6c;border:1px solid #c9a9c2;box-shadow:none}
.akey{position:absolute;left:.9rem;top:4.6rem;z-index:2;width:20rem;max-width:calc(100% - 1.8rem);padding:.8rem .9rem;display:flex;flex-direction:column;gap:.45rem}
.akey .hd{font-size:1.05rem}
.arow{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-size:.9rem;font-weight:700;border-top:1px solid var(--line);padding-top:.45rem}
.sw{display:flex;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
.sw button{font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);background:none;border:0;border-radius:999px;padding:.22rem .7rem;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.alist{display:flex;flex-direction:column;gap:.25rem}
.alist div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.5rem;font-size:.88rem}
.alist i{width:.75rem;height:.75rem;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.alist span{font-weight:600;color:var(--muted);white-space:nowrap}
.anote{margin:0;font-size:.86rem;font-weight:600;line-height:1.3}
.asrc{margin:0;font-size:.72rem;font-weight:600;color:var(--muted);line-height:1.3}
.aear{display:flex;flex-direction:column;gap:.1rem}
.aear b{font-size:.95rem} .aear small{font-size:.74rem;font-weight:600;color:var(--muted)}
.stage[data-view="axo"] .zoomc{z-index:2;bottom:2.3rem}
/* the table: map or aerial photo, the microphone, what was heard */
.seg{display:flex;gap:2px}
.zoomc .seg button{width:auto;padding:0 .7rem;font-size:.82rem}
.zoomc .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.zoomc .mic{width:2.3rem;height:2.3rem;border-radius:9px;border:0;background:var(--sunk)}
.zoomc .mic.on{background:var(--over)}
.heard{position:absolute;left:50%;bottom:4.6rem;transform:translateX(-50%);z-index:3;max-width:62%;background:#1c2a28;color:#fff;border-radius:999px;padding:.45rem 1.1rem;font-size:.95rem;font-weight:600;box-shadow:0 4px 14px rgba(20,40,34,.3)}
.vrow .mic{align-self:center}

/* the listener, and what is added on the table */
.you{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;pointer-events:auto}
.you i{order:2;width:18px;height:18px;border-radius:50%;background:#1c2a28;border:3px solid #fbfdfc;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.you b{order:1;font-family:var(--font);font-size:12px;font-weight:700;color:#fff;background:#1c2a28;border-radius:999px;padding:1px 8px}
.youw{background:none;border:0}
.own{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.85rem;font-weight:700;border-top:1px solid var(--line);padding-top:.45rem}
.own .sw button{font-size:.76rem;padding:.2rem .55rem}
.alts p.vhint{font-size:.78rem;font-weight:600}
.stage[data-view="geo"] .alts{max-height:calc(100% - 9.6rem);overflow:auto}

/* closing a scenario: on the right wall, and back on the sentiment map */
.led{grid-template-rows:minmax(0,1fr) auto}
.closebar{grid-column:1 / -1;display:flex;align-items:center;gap:.6rem;border-top:1px solid var(--line);padding-top:.5rem;min-width:0}
.closeb{font:inherit;font-size:.88rem;font-weight:700;flex:0 0 auto;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:.4rem 1rem;cursor:pointer}
.closeb:disabled{background:var(--accent);cursor:default}
.closed{flex:1 1 auto;min-width:0;display:flex;gap:.35rem;overflow:auto}
.cchip{flex:0 0 auto;display:flex;align-items:center;gap:.3rem;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);padding:.1rem .2rem .1rem .1rem;font-size:.76rem;font-weight:700}
.cchip button{font:inherit;border:0;background:none;color:var(--ink);cursor:pointer;padding:.15rem .5rem;border-radius:999px}
.cchip i{font-style:normal;display:flex;gap:.25rem}
.cchip .cx{color:var(--muted);padding:.1rem .4rem}
.ccard{flex:0 0 auto;border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:.5rem .65rem;display:flex;flex-direction:column;gap:.15rem}
.ccard.on{box-shadow:0 0 0 2px var(--ink)}
.ccard small{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.ccard b{font-size:.95rem} .ccard p{margin:0;font-size:.8rem;font-weight:600;line-height:1.25}
.ccard p.g{color:#2f6957} .ccard p.l{color:#9a3f36} .ccard p.u{color:var(--muted)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-top:.2rem}
.cfoot span{display:flex;gap:.5rem;font-size:.78rem;font-weight:700}
.cfoot button{font:inherit;font-size:.76rem;font-weight:700;border:1px solid var(--ink);border-radius:999px;background:none;color:var(--ink);padding:.2rem .6rem;cursor:pointer}
.ccard.on .cfoot button{background:var(--ink);color:#fff}
/* examples: the room imagined, and the screens with their callouts */
.exs{flex:1 1 auto;min-height:0;border:0;border-radius:0;overflow:auto;padding:4.8rem 1.6rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
.exs .hd{font-size:1.4rem}
.exs figure{margin:0;display:flex;flex-direction:column;gap:.35rem}
.exs img{display:block;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}
.exs figcaption{font-size:.85rem;font-weight:600;color:var(--muted)}
.exs .hero{max-width:70rem;align-self:center;width:100%}
.exgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
/* a light lock: the page asks for a code when one is set */
html.checking .app{visibility:hidden}
.gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem}
.gate form{width:22rem;max-width:100%;padding:1.4rem;display:flex;flex-direction:column;gap:.7rem;margin:0}
.gate h2{font-size:1.3rem} .gate p{margin:0;font-size:.85rem;font-weight:600;color:var(--muted)}
.gate input{font:inherit;font-size:1rem;border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;background:#fff;color:var(--ink)}
.gate button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:.65rem 1rem;background:var(--ink);color:#fff;cursor:pointer}
.gate output{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;word-break:break-all;background:var(--sunk);border-radius:8px;padding:.5rem;user-select:all}

@media (max-width:900px), (max-height:520px){
  html,body{height:auto}
  .app{height:auto}
  .stage{flex:0 0 auto;display:flex;flex-direction:column}
  .stage canvas{position:static;aspect-ratio:16/9;height:auto}
  .alts,.say{position:static;width:auto;max-width:none;border:0;box-shadow:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem 0}
  .tile:nth-child(odd){border-left:0;padding-left:0}
  .walls{flex-direction:column;gap:1rem}
  .scr,.tb{width:100%;transform:none;margin:0}
  .notes3{grid-template-columns:minmax(0,1fr);width:100%}
  .under{flex-direction:column;align-items:stretch}
  .under .note{width:auto}
  .stage > .note{position:static;width:auto;max-width:none}
}
